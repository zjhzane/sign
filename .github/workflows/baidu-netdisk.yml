name: Daily Baidu Netdisk Sign

on:
  schedule:
    - cron: "20 1 * * *"   # 每天 01:20 UTC = 北京时间 09:20
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          BAIDU_COOKIE: ${{ secrets.BAIDU_COOKIE }}
        run: python baidu_netdisk.py
